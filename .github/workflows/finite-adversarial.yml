name: finite-adversarial

on:
  pull_request:
    paths:
      - "experiments/**"
      - "scripts/**"
      - "scripts/validate_reproducibility.py"
      - "scripts/validate_cross_repo_patterns.py"
      - "scripts/validate_vopson_2019_mei.py"
      - "scripts/validate_historical_lineage.py"
      - "scripts/validate_formalization_contracts.py"
      - "scripts/validate_observation_specs.py"
      - "scripts/validate_relation_core.py"
      - "scripts/validate_graph_realization.py"
      - "scripts/verify_graph_artifacts.py"
      - "scripts/validate_bridge_core.py"
      - "scripts/verify_bridge_artifacts.py"
      - "scripts/validate_epistemic_bridge.py"
      - "scripts/verify_epistemic_bridge_artifacts.py"
      - "scripts/validate_representation_calculus.py"
      - "scripts/verify_representation_artifacts.py"
      - "scripts/validate_information_comparability.py"
      - "scripts/verify_information_comparability_artifacts.py"
      - "scripts/validate_recovery_specializations.py"
      - "scripts/verify_recovery_specialization_artifacts.py"
      - "scripts/validate_continuum_stochastic_prevalence.py"
      - "scripts/verify_continuum_stochastic_prevalence_artifacts.py"
      - "scripts/validate_empirical_falsification_profile.py"
      - "scripts/verify_empirical_falsification_profile_artifacts.py"
      - "tests/**"
      - "theory/DEFINITIONS.md"
      - "theory/THEOREM_TARGETS.md"
      - "theory/FINITE_RESULTS.md"
      - "theory/AUXILIARY_CONTRACTS.md"
      - "theory/CROSS_REPO_RESULTS.md"
      - "theory/INVARIANT_CALCULUS.md"
      - "theory/ASSURANCE.md"
      - "theory/DEFINITION_OBLIGATIONS.md"
      - "theory/FALSIFICATION_CONTRACTS.md"
      - "theory/OBSERVATION_CALCULUS.md"
      - "theory/RELATION_CALCULUS.md"
      - "theory/GRAPH_REALIZATION.md"
      - "theory/BRIDGE_CORE.md"
      - "theory/EPISTEMIC_BRIDGE.md"
      - "theory/REPRESENTATION_CALCULUS.md"
      - "theory/INFORMATION_COMPARABILITY.md"
      - "theory/RECOVERY_SPECIALIZATIONS.md"
      - "theory/CONTINUUM_STOCHASTIC_PREVALENCE.md"
      - "theory/EMPIRICAL_FALSIFICATION_PROFILE.md"
      - "research/CROSS_REPO_PATTERN_ATLAS.md"
      - "research/GRAPH_REALIZATION_SOURCES.md"
      - "research/HISTORICAL_LINEAGE.md"
      - "research/vopson/**"
      - "machine/**"
      - "README4AI.md"
      - "docs/CLAIMS.md"
      - "docs/NONCLAIMS.md"
      - "docs/REPRODUCIBILITY.md"
      - "ROADMAP.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "scripts/**"
      - "scripts/validate_reproducibility.py"
      - "scripts/validate_cross_repo_patterns.py"
      - "scripts/validate_vopson_2019_mei.py"
      - "scripts/validate_historical_lineage.py"
      - "scripts/validate_formalization_contracts.py"
      - "scripts/validate_observation_specs.py"
      - "scripts/validate_relation_core.py"
      - "scripts/validate_graph_realization.py"
      - "scripts/verify_graph_artifacts.py"
      - "scripts/validate_bridge_core.py"
      - "scripts/verify_bridge_artifacts.py"
      - "scripts/validate_epistemic_bridge.py"
      - "scripts/verify_epistemic_bridge_artifacts.py"
      - "scripts/validate_representation_calculus.py"
      - "scripts/verify_representation_artifacts.py"
      - "scripts/validate_information_comparability.py"
      - "scripts/verify_information_comparability_artifacts.py"
      - "scripts/validate_recovery_specializations.py"
      - "scripts/verify_recovery_specialization_artifacts.py"
      - "scripts/validate_continuum_stochastic_prevalence.py"
      - "scripts/verify_continuum_stochastic_prevalence_artifacts.py"
      - "scripts/validate_empirical_falsification_profile.py"
      - "scripts/verify_empirical_falsification_profile_artifacts.py"
      - "tests/**"
      - "theory/DEFINITIONS.md"
      - "theory/THEOREM_TARGETS.md"
      - "theory/FINITE_RESULTS.md"
      - "theory/AUXILIARY_CONTRACTS.md"
      - "theory/CROSS_REPO_RESULTS.md"
      - "theory/INVARIANT_CALCULUS.md"
      - "theory/ASSURANCE.md"
      - "theory/DEFINITION_OBLIGATIONS.md"
      - "theory/FALSIFICATION_CONTRACTS.md"
      - "theory/OBSERVATION_CALCULUS.md"
      - "theory/RELATION_CALCULUS.md"
      - "theory/GRAPH_REALIZATION.md"
      - "theory/BRIDGE_CORE.md"
      - "theory/EPISTEMIC_BRIDGE.md"
      - "theory/REPRESENTATION_CALCULUS.md"
      - "theory/INFORMATION_COMPARABILITY.md"
      - "theory/RECOVERY_SPECIALIZATIONS.md"
      - "theory/CONTINUUM_STOCHASTIC_PREVALENCE.md"
      - "theory/EMPIRICAL_FALSIFICATION_PROFILE.md"
      - "research/CROSS_REPO_PATTERN_ATLAS.md"
      - "research/GRAPH_REALIZATION_SOURCES.md"
      - "research/HISTORICAL_LINEAGE.md"
      - "research/vopson/**"
      - "machine/**"
      - "README4AI.md"
      - "docs/CLAIMS.md"
      - "docs/NONCLAIMS.md"
      - "docs/REPRODUCIBILITY.md"
      - "ROADMAP.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  finite-results:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m compileall -q experiments scripts tests

      - name: Validate reproducibility contract
        run: python scripts/validate_reproducibility.py

      - name: Validate cross-repository pattern registry
        run: python scripts/validate_cross_repo_patterns.py

      - name: Validate historical lineage authority surface
        run: python scripts/validate_historical_lineage.py

      - name: Validate PR8 formalization authority surface
        run: python scripts/validate_formalization_contracts.py

      - name: Run PR8 formalization witnesses
        run: |
          python experiments/formalization/run.py --json > /tmp/pr8-formalization.json
          python experiments/run_pr8.py --hash-only > /tmp/pr8-formalization-receipt.json

      - name: Validate PR9 observation authority surface
        run: python scripts/validate_observation_specs.py

      - name: Run PR9 observation witnesses
        run: |
          python experiments/observation/run.py --json > /tmp/pr9-observation.json
          python experiments/run_pr9.py --hash-only > /tmp/pr9-observation-receipt.json

      - name: Validate PR11 relation and selection authority surface
        run: python scripts/validate_relation_core.py

      - name: Run PR11 relation and selection witnesses
        run: |
          python experiments/relation/run.py --json > /tmp/pr11-relation.json
          python experiments/run_pr11.py --hash-only > /tmp/pr11-relation-receipt.json

      - name: Validate graph realization authority surface
        run: python scripts/validate_graph_realization.py

      - name: Run graph realization witnesses
        run: |
          python experiments/graph_realization/run.py --json > /tmp/graph-realization.json
          python experiments/run_graph_realization.py --hash-only > /tmp/graph-realization-receipt.json

      - name: Validate BridgeCore authority surface
        run: python scripts/validate_bridge_core.py

      - name: Run BridgeCore witnesses
        run: |
          python experiments/bridge_core/run.py --json > /tmp/bridge-core.json
          python experiments/run_bridge_core.py --hash-only > /tmp/bridge-core-receipt.json

      - name: Validate Epistemic Bridge authority surface
        run: python scripts/validate_epistemic_bridge.py

      - name: Run Epistemic Bridge witnesses
        run: |
          python experiments/epistemic_bridge/run.py --json > /tmp/epistemic-bridge.json
          python experiments/run_epistemic_bridge.py --hash-only > /tmp/epistemic-bridge-receipt.json

      - name: Validate Representation authority surface
        run: python scripts/validate_representation_calculus.py

      - name: Run Representation witnesses
        run: |
          python experiments/representation_calculus/run.py --json > /tmp/representation.json
          python experiments/run_representation_calculus.py --hash-only > /tmp/representation-receipt.json

      - name: Validate Information Comparability authority surface
        run: python scripts/validate_information_comparability.py

      - name: Run Information Comparability witnesses
        run: |
          python experiments/information_comparability/run.py --json > /tmp/information-comparability.json
          python experiments/run_information_comparability.py --hash-only > /tmp/information-comparability-receipt.json

      - name: Validate Recovery Specializations authority surface
        run: python scripts/validate_recovery_specializations.py

      - name: Run Recovery Specializations witnesses
        run: |
          python experiments/recovery_specializations/run.py --json > /tmp/recovery-specialization.json
          python experiments/run_recovery_specializations.py --hash-only > /tmp/recovery-specialization-receipt.json

      - name: Validate Continuum Stochastic Prevalence authority surface
        run: python scripts/validate_continuum_stochastic_prevalence.py

      - name: Run Continuum Stochastic Prevalence witnesses
        run: |
          python experiments/continuum_stochastic_prevalence/run.py --json > /tmp/continuum-stochastic-prevalence.json
          python experiments/run_continuum_stochastic_prevalence.py --hash-only > /tmp/continuum-stochastic-prevalence-receipt.json

      - name: Validate Empirical Falsification Profile authority surface
        run: python scripts/validate_empirical_falsification_profile.py

      - name: Run Empirical Falsification Profile witnesses
        run: |
          python experiments/empirical_falsification_profile/run.py --json > /tmp/empirical-falsification-profile.json
          python experiments/run_empirical_falsification_profile.py --hash-only > /tmp/empirical-falsification-profile-receipt.json

      - name: Validate Vopson 2019 MEI authority surface
        run: python scripts/validate_vopson_2019_mei.py

      - name: Reproduce Vopson 2019 MEI arithmetic
        run: |
          python experiments/reproduction/vopson_2019_mei/run.py --json > /tmp/vopson-2019-mei.json
          python experiments/run_pr6.py --hash-only > /tmp/vopson-2019-mei-receipt.json

      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v

      - name: Optimized-Python tests
        run: python -O -m unittest discover -s tests -v

      - name: Generate deterministic evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python experiments/run_pr2.py --json > artifacts/pr2-receipt.json 2> artifacts/pr2-receipt.stderr.txt || true
          python experiments/counterexamples/finite_entropy_signs/run.py --json > artifacts/finite-signs.json 2> artifacts/finite-signs.stderr.txt || true
          python experiments/representation/coarse_graining/run.py --json > artifacts/coarse-graining.json 2> artifacts/coarse-graining.stderr.txt || true
          python experiments/reproduction/vopson_2026_polygons/run.py --max-N 16 --max-n 6 --json > artifacts/polygon-audit.json 2> artifacts/polygon-audit.stderr.txt || true
          python experiments/reproduction/vopson_2019_mei/run.py --json > artifacts/vopson-2019-mei.json 2> artifacts/vopson-2019-mei.stderr.txt || true
          python experiments/run_pr6.py --json > artifacts/vopson-2019-mei-receipt.json 2> artifacts/vopson-2019-mei-receipt.stderr.txt || true
          python scripts/validate_vopson_2019_mei.py --json > artifacts/vopson-2019-mei-validation.json 2> artifacts/vopson-2019-mei-validation.stderr.txt || true
          python scripts/validate_cross_repo_patterns.py --json > artifacts/cross-repo-pattern-validation.json 2> artifacts/cross-repo-pattern-validation.stderr.txt || true
          python experiments/run_cross_repo.py --json > artifacts/cross-repo-receipt.json 2> artifacts/cross-repo-receipt.stderr.txt || true
          python scripts/validate_historical_lineage.py --json > artifacts/historical-lineage-validation.json 2> artifacts/historical-lineage-validation.stderr.txt || true
          python experiments/run_lineage.py --json > artifacts/historical-lineage-receipt.json 2> artifacts/historical-lineage-receipt.stderr.txt || true
          python scripts/validate_formalization_contracts.py --json > artifacts/pr8-formalization-validation.json 2> artifacts/pr8-formalization-validation.stderr.txt || true
          python experiments/formalization/run.py --json > artifacts/pr8-formalization-witness.json 2> artifacts/pr8-formalization-witness.stderr.txt || true
          python experiments/run_pr8.py --json > artifacts/pr8-formalization-receipt.json 2> artifacts/pr8-formalization-receipt.stderr.txt || true
          python scripts/validate_observation_specs.py --json > artifacts/pr9-observation-validation.json 2> artifacts/pr9-observation-validation.stderr.txt || true
          python experiments/observation/run.py --json > artifacts/pr9-observation-witness.json 2> artifacts/pr9-observation-witness.stderr.txt || true
          python experiments/run_pr9.py --json > artifacts/pr9-observation-receipt.json 2> artifacts/pr9-observation-receipt.stderr.txt || true
          python scripts/validate_relation_core.py --json > artifacts/pr11-relation-validation.json 2> artifacts/pr11-relation-validation.stderr.txt || true
          python experiments/relation/run.py --json > artifacts/pr11-relation-witness.json 2> artifacts/pr11-relation-witness.stderr.txt || true
          python experiments/run_pr11.py --json > artifacts/pr11-relation-receipt.json 2> artifacts/pr11-relation-receipt.stderr.txt || true
          python scripts/validate_graph_realization.py --json > artifacts/graph-realization-validation.json 2> artifacts/graph-realization-validation.stderr.txt || true
          python experiments/graph_realization/run.py --json > artifacts/graph-realization-witness.json 2> artifacts/graph-realization-witness.stderr.txt || true
          python experiments/run_graph_realization.py --json > artifacts/graph-realization-receipt.json 2> artifacts/graph-realization-receipt.stderr.txt || true
          python scripts/validate_reproducibility.py --json > artifacts/reproducibility-validation.json 2> artifacts/reproducibility-validation.stderr.txt || true

      - name: Generate BridgeCore evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_bridge_core.py --json > artifacts/bridge-core-validation.json 2> artifacts/bridge-core-validation.stderr.txt || true
          python experiments/bridge_core/run.py --json > artifacts/bridge-core-witness.json 2> artifacts/bridge-core-witness.stderr.txt || true
          python experiments/run_bridge_core.py --json > artifacts/bridge-core-receipt.json 2> artifacts/bridge-core-receipt.stderr.txt || true

      - name: Generate Epistemic Bridge evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_epistemic_bridge.py --json > artifacts/epistemic-bridge-validation.json 2> artifacts/epistemic-bridge-validation.stderr.txt || true
          python experiments/epistemic_bridge/run.py --json > artifacts/epistemic-bridge-witness.json 2> artifacts/epistemic-bridge-witness.stderr.txt || true
          python experiments/run_epistemic_bridge.py --json > artifacts/epistemic-bridge-receipt.json 2> artifacts/epistemic-bridge-receipt.stderr.txt || true

      - name: Generate Representation evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_representation_calculus.py --json > artifacts/representation-validation.json 2> artifacts/representation-validation.stderr.txt || true
          python experiments/representation_calculus/run.py --json > artifacts/representation-witness.json 2> artifacts/representation-witness.stderr.txt || true
          python experiments/run_representation_calculus.py --json > artifacts/representation-receipt.json 2> artifacts/representation-receipt.stderr.txt || true

      - name: Generate Information Comparability evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_information_comparability.py --json > artifacts/information-comparability-validation.json 2> artifacts/information-comparability-validation.stderr.txt || true
          python experiments/information_comparability/run.py --json > artifacts/information-comparability-witness.json 2> artifacts/information-comparability-witness.stderr.txt || true
          python experiments/run_information_comparability.py --json > artifacts/information-comparability-receipt.json 2> artifacts/information-comparability-receipt.stderr.txt || true

      - name: Generate Recovery Specializations evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_recovery_specializations.py --json > artifacts/recovery-specialization-validation.json 2> artifacts/recovery-specialization-validation.stderr.txt || true
          python experiments/recovery_specializations/run.py --json > artifacts/recovery-specialization-witness.json 2> artifacts/recovery-specialization-witness.stderr.txt || true
          python experiments/run_recovery_specializations.py --json > artifacts/recovery-specialization-receipt.json 2> artifacts/recovery-specialization-receipt.stderr.txt || true

      - name: Generate Continuum Stochastic Prevalence evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_continuum_stochastic_prevalence.py --json > artifacts/continuum-stochastic-prevalence-validation.json 2> artifacts/continuum-stochastic-prevalence-validation.stderr.txt || true
          python experiments/continuum_stochastic_prevalence/run.py --json > artifacts/continuum-stochastic-prevalence-witness.json 2> artifacts/continuum-stochastic-prevalence-witness.stderr.txt || true
          python experiments/run_continuum_stochastic_prevalence.py --json > artifacts/continuum-stochastic-prevalence-receipt.json 2> artifacts/continuum-stochastic-prevalence-receipt.stderr.txt || true

      - name: Generate Empirical Falsification Profile evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_empirical_falsification_profile.py --json > artifacts/empirical-falsification-profile-validation.json 2> artifacts/empirical-falsification-profile-validation.stderr.txt || true
          python experiments/empirical_falsification_profile/run.py --json > artifacts/empirical-falsification-profile-witness.json 2> artifacts/empirical-falsification-profile-witness.stderr.txt || true
          python experiments/run_empirical_falsification_profile.py --json > artifacts/empirical-falsification-profile-receipt.json 2> artifacts/empirical-falsification-profile-receipt.stderr.txt || true

      - name: Verify retained graph evidence
        if: always()
        run: python scripts/verify_graph_artifacts.py artifacts

      - name: Verify retained BridgeCore evidence
        if: always()
        run: python scripts/verify_bridge_artifacts.py artifacts

      - name: Verify retained Epistemic Bridge evidence
        if: always()
        run: python scripts/verify_epistemic_bridge_artifacts.py artifacts

      - name: Verify retained Representation evidence
        if: always()
        run: python scripts/verify_representation_artifacts.py artifacts

      - name: Verify retained Information Comparability evidence
        if: always()
        run: python scripts/verify_information_comparability_artifacts.py artifacts

      - name: Verify retained Recovery Specializations evidence
        if: always()
        run: python scripts/verify_recovery_specialization_artifacts.py artifacts

      - name: Verify retained Continuum Stochastic Prevalence evidence
        if: always()
        run: python scripts/verify_continuum_stochastic_prevalence_artifacts.py artifacts

      - name: Verify retained Empirical Falsification Profile evidence
        if: always()
        run: python scripts/verify_empirical_falsification_profile_artifacts.py artifacts

      - name: Retain finite evidence bundle
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: finite-adversarial-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
