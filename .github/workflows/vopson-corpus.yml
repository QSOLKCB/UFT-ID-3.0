name: vopson-corpus

on:
  pull_request:
    paths:
      - "research/vopson/**"
      - "scripts/validate_vopson_corpus.py"
      - "scripts/render_vopson_docs.py"
      - "scripts/validate_reproducibility.py"
      - "tests/**"
      - "machine/**"
      - "README.md"
      - "README4AI.md"
      - "AGENTS.md"
      - "docs/REPRODUCIBILITY.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "research/vopson/**"
      - "scripts/validate_vopson_corpus.py"
      - "scripts/render_vopson_docs.py"
      - "scripts/validate_reproducibility.py"
      - "tests/**"
      - "machine/**"
      - "README.md"
      - "README4AI.md"
      - "AGENTS.md"
      - "docs/REPRODUCIBILITY.md"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  repair-fresh-codex-p2:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pr18-empirical-falsification-profile'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pr18-empirical-falsification-profile
          persist-credentials: true
          fetch-depth: 64

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply fresh Codex P2 repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()

          readme = root / "README4AI.md"
          text = readme.read_text(encoding="utf-8")
          old = "Lean remains deferred until source reproduction, notation freeze, theorem freeze, and counterexample freeze. When it begins, `QSOLKCB/QSOL-CONTEXT` is the provenance and supersession spine. The Lean target is an immutable post-merge source tag bound to its exact commit/tree and CI provenance; Lean is a later scholarly layer, not part of the original source-release identity. The Zenodo surface is a deterministic source ZIP, Overview PDF, and release notes with cross-bound checksums. GitHub CI, source tagging, Lean proof, empirical validation, Zenodo archival status, and current canonical theory remain separately classified."
          new = "Lean remains deferred until source reproduction, notation freeze, theorem freeze, and counterexample freeze. Detailed formalization/publication workflow planning is ROADMAP-only; see `ROADMAP.md`. This bootstrap surface does not promote deferred QSOL-CONTEXT, source-tag, Lean, or Zenodo planning into current canonical implementation authority."
          if text.count(old) != 1:
              raise SystemExit("README4AI Lean paragraph anchor drift")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          run = root / "experiments/empirical_falsification_profile/run.py"
          text = run.read_text(encoding="utf-8")
          constructor_pred = "if not refs or any(not isinstance(ref, str) or not ref for ref in refs):"
          evaluator_pred = "if not isinstance(refs, list) or not refs or any(not isinstance(ref, str) or not ref for ref in refs):"
          if text.count(constructor_pred) != 1:
              raise SystemExit("constructor provenance predicate anchor drift")
          if text.count(evaluator_pred) != 1:
              raise SystemExit("evaluator provenance predicate anchor drift")
          text = text.replace(constructor_pred, "if not refs or any(not isinstance(ref, str) or not ref.strip() for ref in refs):")
          text = text.replace(evaluator_pred, "if not isinstance(refs, list) or not refs or any(not isinstance(ref, str) or not ref.strip() for ref in refs):")
          run.write_text(text, encoding="utf-8")

          tests = root / "tests/test_empirical_falsification_profile.py"
          text = tests.read_text(encoding="utf-8")
          old_block = '''        evidence = E.make_evidence(profile, 1, 0)\n        evidence["provenance_refs"] = "SYN-PROV-001"\n        self.assertEqual(E.evaluate(profile, evidence)["decision"], "INVALID_EVIDENCE")\n'''
          new_block = '''        with self.assertRaisesRegex(ValueError, "nonempty string sequence"):\n            E.make_evidence(profile, 1, 0, provenance_refs=["   "])\n        evidence = E.make_evidence(profile, 1, 0)\n        evidence["provenance_refs"] = "SYN-PROV-001"\n        self.assertEqual(E.evaluate(profile, evidence)["decision"], "INVALID_EVIDENCE")\n        whitespace_evidence = E.make_evidence(profile, 1, 0)\n        whitespace_evidence["provenance_refs"] = ["   "]\n        self.assertEqual(E.evaluate(profile, whitespace_evidence)["decision"], "INVALID_EVIDENCE")\n'''
          if text.count(old_block) != 1:
              raise SystemExit("provenance regression anchor drift")
          tests.write_text(text.replace(old_block, new_block), encoding="utf-8")

          readme_blob = subprocess.check_output(["git", "hash-object", "README4AI.md"], text=True).strip()
          graph = root / "scripts/validate_graph_realization.py"
          text = graph.read_text(encoding="utf-8")
          text, n = re.subn(r'"readme4ai": "[0-9a-f]{40}"', f'"readme4ai": "{readme_blob}"', text, count=1)
          if n != 1:
              raise SystemExit("graph README4AI pin anchor drift")
          graph.write_text(text, encoding="utf-8")

          canonical = subprocess.check_output([
              "git", "show", "8c854e9b8bb81f96d4c04be98cdd7a133d73e234:.github/workflows/vopson-corpus.yml"
          ], text=True)
          (root / ".github/workflows/vopson-corpus.yml").write_text(canonical, encoding="utf-8")
          PY

          python -m compileall -q experiments scripts tests
          python scripts/validate_reproducibility.py
          python scripts/validate_graph_realization.py
          python scripts/validate_empirical_falsification_profile.py
          python -m unittest tests.test_empirical_falsification_profile -v

      - name: Commit fresh Codex P2 repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README4AI.md experiments/empirical_falsification_profile/run.py tests/test_empirical_falsification_profile.py scripts/validate_graph_realization.py .github/workflows/vopson-corpus.yml
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "Address fresh EFP Codex P2 findings"
          git push origin HEAD:agent/pr18-empirical-falsification-profile

  validate-corpus:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m compileall -q experiments scripts tests

      - name: Check generated Vopson documentation
        run: python scripts/render_vopson_docs.py --check

      - name: Validate canonical Vopson corpus
        run: python scripts/validate_vopson_corpus.py

      - name: Validate reproducibility contract
        run: python scripts/validate_reproducibility.py

      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v

      - name: Optimized-Python tests
        run: python -O -m unittest discover -s tests -v

      - name: Generate corpus evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_vopson_corpus.py --json > artifacts/vopson-corpus-validation.json 2> artifacts/vopson-corpus-validation.stderr.txt || true
          python scripts/render_vopson_docs.py --check --json > artifacts/vopson-doc-sync.json 2> artifacts/vopson-doc-sync.stderr.txt || true
          python scripts/validate_reproducibility.py --json > artifacts/reproducibility-validation.json 2> artifacts/reproducibility-validation.stderr.txt || true
          python experiments/run_pr2.py --json > artifacts/pr2-receipt.json 2> artifacts/pr2-receipt.stderr.txt || true

      - name: Retain corpus evidence bundle
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vopson-corpus-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
