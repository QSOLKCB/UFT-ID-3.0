name: vopson-corpus

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/pr21_p1_hardening.py"

permissions:
  contents: write

jobs:
  harden-pr21-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pr21-freeze-lean-observation-batch
          persist-credentials: true
          fetch-depth: 128

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply PR21 P1 hardening
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/vopson-corpus.yml /tmp/pr21-vopson-temp.yml
          python tools/pr21_p1_hardening.py
          git show 6f3aeb7f4ac14389e7a08d2976c8c0d16549c093:.github/workflows/vopson-corpus.yml > .github/workflows/vopson-corpus.yml

      - name: Validate hardened freeze
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q experiments scripts tests
          python scripts/validate_reproducibility.py
          python scripts/validate_observation_specs.py
          python scripts/validate_lean_observation_foundation.py
          python scripts/validate_empirical_falsification_profile.py
          python scripts/validate_graph_realization.py
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v

      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pr21-vopson-temp.yml .github/workflows/vopson-corpus.yml
          rm tools/pr21_p1_hardening.py
          git diff --exit-code HEAD -- .github/workflows/vopson-corpus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e tools/pr21_p1_hardening.py
          git commit -m "Harden PR21 pre-tag Lean freeze"
          git push origin HEAD:agent/pr21-freeze-lean-observation-batch
