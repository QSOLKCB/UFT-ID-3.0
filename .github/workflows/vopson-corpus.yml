name: vopson-corpus

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/post_efp_rollover_patch.py"

permissions:
  contents: write

jobs:
  post-efp-roadmap-rollover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/post-efp-roadmap-rollover
          persist-credentials: true
          fetch-depth: 128

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply roadmap rollover
        shell: bash
        run: |
          set -euo pipefail
          python tools/post_efp_rollover_patch.py
          git show origin/main:.github/workflows/vopson-corpus.yml > .github/workflows/vopson-corpus.yml
          rm tools/post_efp_rollover_patch.py

      - name: Validate rollover authority
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments scripts tests
          python scripts/validate_reproducibility.py
          python scripts/validate_relation_core.py
          python scripts/validate_graph_realization.py
          python scripts/validate_bridge_core.py
          python scripts/validate_epistemic_bridge.py
          python scripts/validate_representation_calculus.py
          python scripts/validate_information_comparability.py
          python scripts/validate_recovery_specializations.py
          python scripts/validate_continuum_stochastic_prevalence.py
          python scripts/validate_empirical_falsification_profile.py
          python -m unittest discover -s tests -v

      - name: Commit rollover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e tools/post_efp_rollover_patch.py
          git diff --cached --name-only
          git commit -m "Roll roadmap from EFP to Lean theorem freeze"
          git push origin HEAD:agent/post-efp-roadmap-rollover
