name: vopson-corpus

on:
  pull_request:
    paths:
      - "research/vopson/**"
      - "scripts/validate_vopson_corpus.py"
      - "tests/test_vopson_corpus.py"
      - "machine/contract.json"
      - "README4AI.md"
      - "AGENTS.md"
      - ".github/workflows/vopson-corpus.yml"
  push:
    branches: [main]
    paths:
      - "research/vopson/**"
      - "scripts/validate_vopson_corpus.py"
      - "tests/test_vopson_corpus.py"
      - "machine/contract.json"
      - ".github/workflows/vopson-corpus.yml"

permissions:
  contents: read

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical Vopson corpus
        run: python3 scripts/validate_vopson_corpus.py
      - name: Emit machine validation report
        run: python3 scripts/validate_vopson_corpus.py --json > /tmp/vopson-corpus-validation.json
      - name: Run repository unit tests
        run: python3 -m unittest discover -s tests -v
