name: vopson-corpus

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/pr21_latest_codex_fix.py"
      - "tools/pr21_latest_codex_fix_wrapper.py"

permissions:
  contents: write

jobs:
  repair-pr21-latest-codex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pr21-freeze-lean-observation-batch
          persist-credentials: true
          fetch-depth: 128

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply latest Codex repairs
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/vopson-corpus.yml /tmp/pr21-staging.yml
          python tools/pr21_latest_codex_fix_wrapper.py
          git show 5e1f8f1ad62e52cf9521dcef151645127eab8fc8:.github/workflows/vopson-corpus.yml > .github/workflows/vopson-corpus.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/vopson-corpus.yml')
          text = p.read_text()
          old = '        with:\n          persist-credentials: false\n\n      - uses: actions/setup-python@'
          new = '        with:\n          persist-credentials: false\n          fetch-depth: 2\n\n      - uses: actions/setup-python@'
          if text.count(old) != 1:
              raise SystemExit('checkout anchor drift')
          text = text.replace(old, new, 1)
          old = '      - name: Validate Lean observation source freeze\n        run: python scripts/validate_lean_observation_foundation.py\n'
          new = '      - name: Validate Lean observation source freeze\n        env:\n          UFT_REQUIRE_BASIS_COMMIT_OBJECT: "1"\n        run: python scripts/validate_lean_observation_foundation.py\n'
          if text.count(old) != 1:
              raise SystemExit('freeze step anchor drift')
          p.write_text(text)
          PY

      - name: Validate repaired authority
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q experiments scripts tests
          python scripts/render_vopson_docs.py --check
          python scripts/validate_vopson_corpus.py
          python scripts/validate_reproducibility.py
          python scripts/validate_cross_repo_patterns.py
          python scripts/validate_historical_lineage.py
          python scripts/validate_formalization_contracts.py
          python scripts/validate_observation_specs.py
          UFT_REQUIRE_BASIS_COMMIT_OBJECT=1 python scripts/validate_lean_observation_foundation.py
          python scripts/validate_relation_core.py
          python scripts/validate_graph_realization.py
          python scripts/validate_bridge_core.py
          python scripts/validate_epistemic_bridge.py
          python scripts/validate_representation_calculus.py
          python scripts/validate_information_comparability.py
          python scripts/validate_recovery_specializations.py
          python scripts/validate_continuum_stochastic_prevalence.py
          python scripts/validate_empirical_falsification_profile.py
          python scripts/validate_vopson_2019_mei.py
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pr21-staging.yml .github/workflows/vopson-corpus.yml
          rm tools/pr21_latest_codex_fix.py tools/pr21_latest_codex_fix_wrapper.py
          git diff --exit-code HEAD -- .github/workflows/vopson-corpus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e tools/pr21_latest_codex_fix.py
          test ! -e tools/pr21_latest_codex_fix_wrapper.py
          git commit -m "Close latest PR21 Codex authority gaps"
          git push origin HEAD:agent/pr21-freeze-lean-observation-batch
