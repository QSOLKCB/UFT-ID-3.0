name: vopson-corpus

on:
  pull_request:
    paths:
      - "research/vopson/**"
      - "scripts/validate_vopson_corpus.py"
      - "scripts/render_vopson_docs.py"
      - "scripts/validate_reproducibility.py"
      - "tests/**"
      - "machine/**"
      - "README.md"
      - "README4AI.md"
      - "AGENTS.md"
      - "docs/REPRODUCIBILITY.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "research/vopson/**"
      - "scripts/validate_vopson_corpus.py"
      - "scripts/render_vopson_docs.py"
      - "scripts/validate_reproducibility.py"
      - "tests/**"
      - "machine/**"
      - "README.md"
      - "README4AI.md"
      - "AGENTS.md"
      - "docs/REPRODUCIBILITY.md"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  repair-latest-two-p2:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pr18-empirical-falsification-profile
          persist-credentials: true
          fetch-depth: 64

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply and verify latest two Codex P2 repairs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD d6a01ea23c70be2406d9818a2f900d0678ec292e)" = "d6a01ea23c70be2406d9818a2f900d0678ec292e"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor drift")
              path.write_text(text.replace(old, new), encoding="utf-8")

          run = root / "experiments/empirical_falsification_profile/run.py"
          replace_once(
              run,
              '        "profile_id": profile_id or expected_profile_id,\n',
              '        "profile_id": expected_profile_id if profile_id is None else profile_id,\n',
              "profile-id default",
          )

          validator = root / "scripts/validate_empirical_falsification_profile.py"
          expected_projection = '''EXPECTED_BASE_PROJECTION = {
              "hypothesis_id": "H-SYN-BOUND-001",
              "claim_class": "DIAGNOSTIC",
              "independent_variables": [],
              "perturbations": [],
              "observables": ["OBS-SYN-Y-V1"],
              "predictions": [{"kind": "upper-bound", "observable_id": "OBS-SYN-Y-V1", "upper_bound": 0}],
              "null_model": {"kind": "boundary-equality", "observable_id": "OBS-SYN-Y-V1", "value": 0},
              "rejection_conditions": [{"kind": "interval-entirely-above-threshold", "threshold": 0}],
              "evidence_required": [
                  "matching observable_id",
                  "matching measurement_spec_id",
                  "matching calibration_id",
                  "exact nonnegative uncertainty_radius",
                  "at least one provenance_ref",
                  "matching profile_fingerprint",
                  "declared external-unverified prior_registration_status",
              ],
              "scope_limits": [
                  "synthetic exact interval decision semantics only",
                  "synthetic conformance only",
                  "no empirical-rejection licence",
              ],
              "status": "synthetic-conformance",
          }

          '''
          replace_once(
              validator,
              '\n\nEXPECTED_PRIMARY_TYPES = {\n',
              '\n\n' + expected_projection + 'EXPECTED_PRIMARY_TYPES = {\n',
              "expected base projection insertion",
          )
          replace_once(
              validator,
              '''    else:\n        canonical_projection = projection_fn(make_profile_fn(0))\n        if tuple(canonical_projection) != tuple(EXPECTED_BASE_FALSIFICATION["required_fields"]):\n            errors.append("EFP runtime base projection drift")\n''',
              '''    else:\n        canonical_projection = projection_fn(make_profile_fn(0))\n        if canonical_projection != EXPECTED_BASE_PROJECTION:\n            errors.append("EFP runtime base projection drift")\n''',
              "complete projection comparison",
          )

          tests = root / "tests/test_empirical_falsification_profile.py"
          replace_once(
              tests,
              '''        with self.assertRaisesRegex(ValueError, "profile_id drift"):\n            E.make_profile(0, profile_id="EFP-SYN-UNREGISTERED")\n''',
              '''        for bad_profile_id in ("", "   "):\n            with self.subTest(bad_profile_id=repr(bad_profile_id)):\n                with self.assertRaisesRegex(ValueError, "nonempty string"):\n                    E.make_profile(0, profile_id=bad_profile_id)\n        with self.assertRaisesRegex(ValueError, "profile_id drift"):\n            E.make_profile(0, profile_id="EFP-SYN-UNREGISTERED")\n''',
              "empty profile-id regression",
          )
          replace_once(
              tests,
              '''        projection = E.base_falsification_spec(profile)\n        self.assertEqual(tuple(projection), tuple(base["required_fields"]))\n        self.assertEqual(set(E.BASE_FALSIFICATION_FIELD_MAPPING), set(base["required_fields"]))\n        self.assertEqual(projection["observables"], [profile["observable_id"]])\n        self.assertEqual(projection["predictions"], [profile["prediction"]])\n        self.assertEqual(projection["null_model"], profile["null_model"])\n        self.assertEqual(projection["rejection_conditions"], [profile["rejection_rule"]])\n        self.assertEqual(projection["status"], "synthetic-conformance")\n''',
              '''        projection = E.base_falsification_spec(profile)\n        expected_projection = {\n            "hypothesis_id": profile["hypothesis_id"],\n            "claim_class": profile["claim_class"],\n            "independent_variables": [],\n            "perturbations": [],\n            "observables": [profile["observable_id"]],\n            "predictions": [profile["prediction"]],\n            "null_model": profile["null_model"],\n            "rejection_conditions": [profile["rejection_rule"]],\n            "evidence_required": profile["evidence_requirements"],\n            "scope_limits": [profile["scope"], "synthetic conformance only", "no empirical-rejection licence"],\n            "status": "synthetic-conformance",\n        }\n        self.assertEqual(projection, expected_projection)\n        self.assertEqual(tuple(projection), tuple(base["required_fields"]))\n        self.assertEqual(set(E.BASE_FALSIFICATION_FIELD_MAPPING), set(base["required_fields"]))\n''',
              "complete projection regression",
          )
          insert_anchor = '    def test_string_and_bytes_provenance_are_rejected_before_list_coercion(self):\n'
          new_test = '''    def test_validator_rejects_complete_base_projection_drift(self):\n        original_loader = V.load_module\n        canonical = E.run_suite()\n\n        class FakeExperiment:\n            BASE_FALSIFICATION_FIELD_MAPPING = E.BASE_FALSIFICATION_FIELD_MAPPING\n            make_profile = staticmethod(E.make_profile)\n\n            @staticmethod\n            def base_falsification_spec(profile):\n                projection = E.base_falsification_spec(profile)\n                projection["scope_limits"] = [profile["scope"], "synthetic conformance only"]\n                return projection\n\n            @staticmethod\n            def run_suite():\n                return deepcopy(canonical)\n\n        try:\n            V.load_module = lambda name, path: FakeExperiment if path.resolve() == V.PATHS["experiment"].resolve() else original_loader(name, path)\n            result = V.validate()\n        finally:\n            V.load_module = original_loader\n        self.assertEqual(result["status"], "error")\n        self.assertIn("EFP runtime base projection drift", result["errors"])\n\n'''
          text = tests.read_text(encoding="utf-8")
          if text.count(insert_anchor) != 1:
              raise SystemExit("projection drift test insertion anchor drift")
          tests.write_text(text.replace(insert_anchor, new_test + insert_anchor), encoding="utf-8")

          canonical = subprocess.check_output([
              "git", "show", "d6a01ea23c70be2406d9818a2f900d0678ec292e:.github/workflows/vopson-corpus.yml"
          ], text=True)
          (root / ".github/workflows/vopson-corpus.yml").write_text(canonical, encoding="utf-8")
          PY

          python -m compileall -q experiments scripts tests
          python scripts/validate_reproducibility.py
          python scripts/validate_empirical_falsification_profile.py
          python -m unittest tests.test_empirical_falsification_profile -v
          git diff --exit-code d6a01ea23c70be2406d9818a2f900d0678ec292e -- .github/workflows/vopson-corpus.yml

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/empirical_falsification_profile/run.py scripts/validate_empirical_falsification_profile.py tests/test_empirical_falsification_profile.py .github/workflows/vopson-corpus.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix final EFP Codex review findings"
          git push origin HEAD:agent/pr18-empirical-falsification-profile

  validate-corpus:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m compileall -q experiments scripts tests

      - name: Check generated Vopson documentation
        run: python scripts/render_vopson_docs.py --check

      - name: Validate canonical Vopson corpus
        run: python scripts/validate_vopson_corpus.py

      - name: Validate reproducibility contract
        run: python scripts/validate_reproducibility.py

      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v

      - name: Optimized-Python tests
        run: python -O -m unittest discover -s tests -v

      - name: Generate corpus evidence bundle
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_vopson_corpus.py --json > artifacts/vopson-corpus-validation.json 2> artifacts/vopson-corpus-validation.stderr.txt || true
          python scripts/render_vopson_docs.py --check --json > artifacts/vopson-doc-sync.json 2> artifacts/vopson-doc-sync.stderr.txt || true
          python scripts/validate_reproducibility.py --json > artifacts/reproducibility-validation.json 2> artifacts/reproducibility-validation.stderr.txt || true
          python experiments/run_pr2.py --json > artifacts/pr2-receipt.json 2> artifacts/pr2-receipt.stderr.txt || true

      - name: Retain corpus evidence bundle
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vopson-corpus-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
