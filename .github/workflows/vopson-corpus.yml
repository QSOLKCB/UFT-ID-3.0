name: vopson-corpus

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/pr21_freeze_patch.py"
      - "tools/pr21_freeze_patch_fix.py"
      - "machine/lean_observation_foundation_contract.json"
      - "theory/LEAN_OBSERVATION_FOUNDATION.md"
      - "scripts/validate_lean_observation_foundation.py"
      - "tests/test_lean_observation_foundation.py"

permissions:
  contents: write

jobs:
  freeze-pr21-source-batch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pr21-freeze-lean-observation-batch
          persist-credentials: true
          fetch-depth: 128

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply PR21 source freeze integration
        shell: bash
        run: |
          set -euo pipefail
          python tools/pr21_freeze_patch.py
          python tools/pr21_freeze_patch_fix.py
          git show 6f3aeb7f4ac14389e7a08d2976c8c0d16549c093:.github/workflows/vopson-corpus.yml > .github/workflows/vopson-corpus.yml
          rm tools/pr21_freeze_patch.py tools/pr21_freeze_patch_fix.py
          git diff --exit-code 6f3aeb7f4ac14389e7a08d2976c8c0d16549c093 -- .github/workflows/vopson-corpus.yml

      - name: Validate PR21 freeze authority
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q experiments scripts tests
          python scripts/render_vopson_docs.py --check
          python scripts/validate_vopson_corpus.py
          python scripts/validate_reproducibility.py
          python scripts/validate_cross_repo_patterns.py
          python scripts/validate_historical_lineage.py
          python scripts/validate_formalization_contracts.py
          python scripts/validate_observation_specs.py
          python scripts/validate_lean_observation_foundation.py
          python scripts/validate_relation_core.py
          python scripts/validate_graph_realization.py
          python scripts/validate_bridge_core.py
          python scripts/validate_epistemic_bridge.py
          python scripts/validate_representation_calculus.py
          python scripts/validate_information_comparability.py
          python scripts/validate_recovery_specializations.py
          python scripts/validate_continuum_stochastic_prevalence.py
          python scripts/validate_empirical_falsification_profile.py
          python scripts/validate_vopson_2019_mei.py
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v

      - name: Commit PR21 source freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e tools/pr21_freeze_patch.py
          test ! -e tools/pr21_freeze_patch_fix.py
          git diff --cached --name-only
          git commit -m "Freeze first PR10 Lean observation theorem batch"
          git push origin HEAD:agent/pr21-freeze-lean-observation-batch
