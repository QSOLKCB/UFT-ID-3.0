name: vopson-corpus

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  repair-latest-codex-p2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pr18-empirical-falsification-profile
          persist-credentials: true
          fetch-depth: 96

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply and verify latest Codex P2 repairs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 7c12a5015e420d43bde1d793e8d8a0cab272cc29)" = "7c12a5015e420d43bde1d793e8d8a0cab272cc29"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          root = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor drift: {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          # 1) Canonicalize every Mapping shape accepted by profile validation.
          run = root / "experiments/empirical_falsification_profile/run.py"
          replace_once(
              run,
              '''    if isinstance(value, dict):
                  return {str(key): _canonicalize(item) for key, item in sorted(value.items(), key=lambda pair: str(pair[0]))}
          ''',
              '''    if isinstance(value, Mapping):
                  return {str(key): _canonicalize(item) for key, item in sorted(value.items(), key=lambda pair: str(pair[0]))}
          ''',
              "mapping canonicalization",
          )

          # 2) Close the EFP receipt over the complete CSP validator dependency surface.
          receipt = root / "experiments/run_empirical_falsification_profile.py"
          verifier = root / "scripts/verify_empirical_falsification_profile_artifacts.py"
          for path, list_kind in ((receipt, "list"), (verifier, "tuple")):
              replace_once(
                  path,
                  '    "machine/continuum_stochastic_prevalence_contract.json",\n',
                  '    "machine/continuum_stochastic_prevalence_contract.json",\n'
                  '    "machine/continuum_stochastic_prevalence_results.json",\n'
                  '    "machine/recovery_specialization_contract.json",\n'
                  '    "machine/relation_contract.json",\n',
                  f"{list_kind} CSP machine closure",
              )
              replace_once(
                  path,
                  '    "theory/FALSIFICATION_CONTRACTS.md",\n',
                  '    "theory/FALSIFICATION_CONTRACTS.md",\n'
                  '    "theory/CONTINUUM_STOCHASTIC_PREVALENCE.md",\n',
                  f"{list_kind} CSP theory closure",
              )
              replace_once(
                  path,
                  '    "scripts/verify_empirical_falsification_profile_artifacts.py",\n',
                  '    "scripts/verify_empirical_falsification_profile_artifacts.py",\n'
                  '    "scripts/validate_continuum_stochastic_prevalence.py",\n'
                  '    "scripts/validate_continuum_stochastic_prevalence_pr18_frozen.py",\n'
                  '    "scripts/verify_continuum_stochastic_prevalence_artifacts.py",\n',
                  f"{list_kind} CSP validator closure",
              )
              replace_once(
                  path,
                  '    "experiments/empirical_falsification_profile/run.py",\n',
                  '    "experiments/empirical_falsification_profile/run.py",\n'
                  '    "experiments/continuum_stochastic_prevalence/run.py",\n',
                  f"{list_kind} CSP experiment closure",
              )
              replace_once(
                  path,
                  '    "tests/test_empirical_falsification_profile.py",\n',
                  '    "tests/test_empirical_falsification_profile.py",\n'
                  '    "tests/test_continuum_stochastic_prevalence.py",\n',
                  f"{list_kind} CSP tests closure",
              )
              replace_once(
                  path,
                  '    "experiments/run_empirical_falsification_profile.py",\n',
                  '    "experiments/run_empirical_falsification_profile.py",\n'
                  '    "experiments/run_continuum_stochastic_prevalence.py",\n',
                  f"{list_kind} CSP receipt closure",
              )

          # 3) A PROVED theorem must contain exactly one nonempty human proof block.
          validator = root / "scripts/validate_empirical_falsification_profile.py"
          proof_helper = textwrap.dedent('''\

          def proof_block(sec: str) -> str | None:
              lines = sec.splitlines()
              markers = [i for i, line in enumerate(lines) if line.strip().startswith("**Proof.**")]
              if len(markers) != 1:
                  return None
              index = markers[0]
              first = lines[index].strip()[len("**Proof.**"):].strip()
              body = [first] if first else []
              for line in lines[index + 1:]:
                  stripped = line.strip()
                  if not stripped or re.match(r"^#+\\s", stripped):
                      break
                  body.append(stripped)
              text = " ".join(body).strip()
              return text or None
          ''')
          replace_once(
              validator,
              "\n\ndef validate() -> dict[str, object]:\n",
              proof_helper + "\n\ndef validate() -> dict[str, object]:\n",
              "proof helper insertion",
          )
          theorem_anchor = '''        if parse_json_metadata(sec, "Canonical hypotheses") != expected["hypotheses"]: errors.append(f"{rid} human canonical hypotheses drift")
                  if parse_json_metadata(sec, "Canonical nonclaims") != expected["nonclaims"]: errors.append(f"{rid} human canonical nonclaims drift")
          '''
          theorem_replacement = theorem_anchor + '''        if proof_block(sec) is None: errors.append(f"{rid} human proof block missing, duplicated, or empty")
          '''
          replace_once(validator, theorem_anchor, theorem_replacement, "theorem proof enforcement")

          # 4) Direct regressions for all three review findings.
          tests = root / "tests/test_empirical_falsification_profile.py"
          replace_once(
              tests,
              "from pathlib import Path\nimport unittest\n",
              "from pathlib import Path\nfrom types import MappingProxyType\nimport unittest\n",
              "MappingProxyType import",
          )
          replace_once(
              tests,
              'V = load_module("efp_validator", "scripts/validate_empirical_falsification_profile.py")\n',
              'V = load_module("efp_validator", "scripts/validate_empirical_falsification_profile.py")\n'
              'R = load_module("efp_receipt_runner", "experiments/run_empirical_falsification_profile.py")\n'
              'A = load_module("efp_artifact_verifier", "scripts/verify_empirical_falsification_profile_artifacts.py")\n',
              "receipt/verifier test imports",
          )

          mapping_test = textwrap.indent(textwrap.dedent('''\
          def test_mapping_proxy_profile_fields_are_hashable_and_evaluable(self):
              profile = E.make_profile(Fraction(0))
              proxied = dict(profile)
              for key in ("prediction", "null_model", "rejection_rule"):
                  proxied[key] = MappingProxyType(dict(profile[key]))
              self.assertEqual(E.profile_fingerprint(proxied), E.profile_fingerprint(profile))
              evidence = E.make_evidence(proxied, 1, 0)
              self.assertEqual(E.evaluate(proxied, evidence)["decision"], "REJECTED_IN_SCOPE")

          '''), "    ")
          replace_once(
              tests,
              "    def test_profile_semantics_are_exact_bound(self):\n",
              mapping_test + "    def test_profile_semantics_are_exact_bound(self):\n",
              "mapping regression insertion",
          )

          closure_and_proof_tests = textwrap.indent(textwrap.dedent('''\
          def test_receipt_hashes_complete_csp_validator_dependency_closure(self):
              expected = {
                  "machine/continuum_stochastic_prevalence_contract.json",
                  "machine/continuum_stochastic_prevalence_results.json",
                  "machine/recovery_specialization_contract.json",
                  "machine/relation_contract.json",
                  "machine/contract.json",
                  "machine/roadmap_state.json",
                  "theory/CONTINUUM_STOCHASTIC_PREVALENCE.md",
                  "ROADMAP.md",
                  "README4AI.md",
                  "docs/CLAIMS.md",
                  "docs/REPRODUCIBILITY.md",
                  "experiments/continuum_stochastic_prevalence/run.py",
                  "tests/test_continuum_stochastic_prevalence.py",
                  "experiments/run_continuum_stochastic_prevalence.py",
                  "scripts/verify_continuum_stochastic_prevalence_artifacts.py",
                  "scripts/validate_continuum_stochastic_prevalence.py",
                  "scripts/validate_continuum_stochastic_prevalence_pr18_frozen.py",
                  ".github/workflows/finite-adversarial.yml",
              }
              self.assertTrue(expected.issubset(set(R.CORE_FILES)))
              self.assertTrue(expected.issubset(set(A.EXPECTED_CORE_FILES)))

          def test_proved_theorem_requires_exactly_one_nonempty_human_proof_block(self):
              heading = "## UFT-EFP-001 Empirical rejection requires complete profile-matched evidence"

              def remove_proof(text):
                  start = text.index(heading)
                  proof_start = text.index("**Proof.**", start)
                  proof_end = text.index("\\n", proof_start)
                  return text[:proof_start] + text[proof_end + 1:]

              result = self._mutate_text("theory/EMPIRICAL_FALSIFICATION_PROFILE.md", remove_proof)
              self.assertEqual(result["status"], "error")
              self.assertIn("UFT-EFP-001 human proof block missing, duplicated, or empty", result["errors"])

              def empty_proof(text):
                  start = text.index(heading)
                  proof_start = text.index("**Proof.**", start)
                  proof_end = text.index("\\n", proof_start)
                  return text[:proof_start] + "**Proof.**\\n" + text[proof_end + 1:]

              result = self._mutate_text("theory/EMPIRICAL_FALSIFICATION_PROFILE.md", empty_proof)
              self.assertEqual(result["status"], "error")
              self.assertIn("UFT-EFP-001 human proof block missing, duplicated, or empty", result["errors"])

              def duplicate_proof(text):
                  start = text.index(heading)
                  proof_start = text.index("**Proof.**", start)
                  proof_end = text.index("\\n", proof_start)
                  proof_line = text[proof_start:proof_end]
                  return text[:proof_end + 1] + proof_line + "\\n" + text[proof_end + 1:]

              result = self._mutate_text("theory/EMPIRICAL_FALSIFICATION_PROFILE.md", duplicate_proof)
              self.assertEqual(result["status"], "error")
              self.assertIn("UFT-EFP-001 human proof block missing, duplicated, or empty", result["errors"])

          '''), "    ")
          replace_once(
              tests,
              "    def test_future_snapshot_dates_fail_closed(self):\n",
              closure_and_proof_tests + "    def test_future_snapshot_dates_fail_closed(self):\n",
              "closure/proof regression insertion",
          )

          # Restore the canonical helper workflow before validation and commit.
          canonical = subprocess.check_output([
              "git", "show", "7c12a5015e420d43bde1d793e8d8a0cab272cc29:.github/workflows/vopson-corpus.yml"
          ], text=True)
          (root / ".github/workflows/vopson-corpus.yml").write_text(canonical, encoding="utf-8")
          PY

          python -m compileall -q experiments scripts tests
          python scripts/validate_reproducibility.py
          python scripts/validate_empirical_falsification_profile.py
          python -m unittest tests.test_empirical_falsification_profile -v
          rm -rf /tmp/efp-latest-artifacts
          mkdir -p /tmp/efp-latest-artifacts
          python scripts/validate_empirical_falsification_profile.py --json > /tmp/efp-latest-artifacts/empirical-falsification-profile-validation.json
          python experiments/empirical_falsification_profile/run.py --json > /tmp/efp-latest-artifacts/empirical-falsification-profile-witness.json
          python experiments/run_empirical_falsification_profile.py --json > /tmp/efp-latest-artifacts/empirical-falsification-profile-receipt.json
          python scripts/verify_empirical_falsification_profile_artifacts.py /tmp/efp-latest-artifacts

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/empirical_falsification_profile/run.py \
            experiments/run_empirical_falsification_profile.py \
            scripts/validate_empirical_falsification_profile.py \
            scripts/verify_empirical_falsification_profile_artifacts.py \
            tests/test_empirical_falsification_profile.py \
            .github/workflows/vopson-corpus.yml
          expected="$(printf '%s\n' \
            .github/workflows/vopson-corpus.yml \
            experiments/empirical_falsification_profile/run.py \
            experiments/run_empirical_falsification_profile.py \
            scripts/validate_empirical_falsification_profile.py \
            scripts/verify_empirical_falsification_profile_artifacts.py \
            tests/test_empirical_falsification_profile.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "Close EFP validator proof and receipt dependencies"
          git push origin HEAD:agent/pr18-empirical-falsification-profile
