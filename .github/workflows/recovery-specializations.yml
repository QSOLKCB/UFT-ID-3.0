name: recovery-specializations

on:
  pull_request:
    paths:
      - "machine/recovery_specialization_*.json"
      - "machine/relation_contract.json"
      - "machine/roadmap_state.json"
      - "theory/RECOVERY_SPECIALIZATIONS.md"
      - "theory/RELATION_CALCULUS.md"
      - "experiments/recovery_specializations/**"
      - "experiments/run_recovery_specializations.py"
      - "scripts/validate_recovery_specializations.py"
      - "scripts/verify_recovery_specialization_artifacts.py"
      - "tests/test_recovery_specializations.py"
      - "ROADMAP.md"
      - ".github/workflows/recovery-specializations.yml"
  push:
    branches: [main]
    paths:
      - "machine/recovery_specialization_*.json"
      - "machine/relation_contract.json"
      - "machine/roadmap_state.json"
      - "theory/RECOVERY_SPECIALIZATIONS.md"
      - "theory/RELATION_CALCULUS.md"
      - "experiments/recovery_specializations/**"
      - "experiments/run_recovery_specializations.py"
      - "scripts/validate_recovery_specializations.py"
      - "scripts/verify_recovery_specialization_artifacts.py"
      - "tests/test_recovery_specializations.py"
      - "ROADMAP.md"
      - ".github/workflows/recovery-specializations.yml"

permissions:
  contents: read

jobs:
  recovery-specialization:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m compileall -q experiments scripts tests

      - name: Validate frozen relation core compatibility
        run: python scripts/validate_relation_core.py

      - name: Validate Recovery Specializations authority
        run: python scripts/validate_recovery_specializations.py

      - name: Run Recovery Specializations witness
        run: python experiments/recovery_specializations/run.py --json > /tmp/recovery-specialization-witness.json

      - name: Run deterministic Recovery Specializations receipt
        run: python experiments/run_recovery_specializations.py --hash-only

      - name: Recovery Specializations adversarial tests
        run: python -m unittest discover -s tests -p 'test_recovery_specializations.py' -v

      - name: Recovery Specializations optimized-Python tests
        run: python -O -m unittest discover -s tests -p 'test_recovery_specializations.py' -v

      - name: Generate Recovery Specializations retained evidence
        if: always()
        run: |
          mkdir -p artifacts
          python scripts/validate_recovery_specializations.py --json > artifacts/recovery-specialization-validation.json 2> artifacts/recovery-specialization-validation.stderr.txt || true
          python experiments/recovery_specializations/run.py --json > artifacts/recovery-specialization-witness.json 2> artifacts/recovery-specialization-witness.stderr.txt || true
          python experiments/run_recovery_specializations.py --json > artifacts/recovery-specialization-receipt.json 2> artifacts/recovery-specialization-receipt.stderr.txt || true

      - name: Verify retained Recovery Specializations evidence
        if: always()
        run: python scripts/verify_recovery_specialization_artifacts.py artifacts

      - name: Retain Recovery Specializations evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: recovery-specializations-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
